name: Validate and Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  EXPO_NO_TELEMETRY: 1
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Run unit tests with coverage
        run: pnpm exec jest --runInBand --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  build-android-apk:
    name: Build Android bundled release APK
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate Android project from Expo config
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Set up Java 17 and Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build self-contained release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Package bundled APK and checksum
        id: package_apk
        shell: bash
        run: |
          apk_path="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          unzip -l "$apk_path" | grep -q 'assets/index.android.bundle'
          zipalign_bin="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -n "$zipalign_bin"
          "$zipalign_bin" -c -P 16 -v 4 "$apk_path"
          mkdir -p dist
          version="$(node -p "require('./package.json').version")"
          apk_name="TSVaultKeySafe-${version}-${GITHUB_SHA::7}-bundled.apk"
          cp "$apk_path" "dist/$apk_name"
          sha256sum "dist/$apk_name" | tee "dist/$apk_name.sha256"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v6
        with:
          name: TSVaultKeySafe-bundled-apk-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish build summary
        shell: bash
        run: |
          {
            echo '## Self-contained Android APK build'
            echo
            echo "- APK: \`${{ steps.package_apk.outputs.apk_name }}\`"
            echo "- Artifact: [Download APK](${{ steps.upload_apk.outputs.artifact-url }})"
            echo '- Variant: `release` with the JavaScript bundle embedded; no Metro server is required.'
            echo '- Compatibility: verified for 16 KB Android page-size packaging.'
            echo '- Integrity: the artifact includes a SHA-256 checksum file.'
          } >> "$GITHUB_STEP_SUMMARY"
